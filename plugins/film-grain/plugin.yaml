name: film-grain
version: 1.0.0
description: Adds cinematic film grain effect to video clips
author: CloudCut
license: MIT
extension_point: effects.video
plugin_type: go
entry_point: film-grain.so
params:
  - name: intensity
    type: float
    description: Grain intensity (0.0 = none, 1.0 = maximum)
    default: 0.5
    min: 0.0
    max: 1.0
    required: false
  - name: size
    type: float
    description: Grain particle size multiplier
    default: 1.0
    min: 0.1
    max: 5.0
    required: false
